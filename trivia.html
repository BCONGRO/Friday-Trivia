<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Trivia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 2.8em;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
        }
        
        .subheader {
            text-align: center;
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .week-label {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .question-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        
        .question-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        
        .question {
            font-size: 1.3em;
            color: #333;
            line-height: 1.5;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1em;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .radio-option:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }
        
        .radio-option input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 20px;
            height: 20px;
        }
        
        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
            flex: 1;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #c3e6cb;
        }
        
        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #f5c6cb;
        }

        .admin-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .admin-toggle {
            background: #6c757d;
            margin-bottom: 20px;
        }

        .admin-form {
            display: none;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            min-height: 100px;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BASIL'S BRAIN BUSTERS 🧠</h1>
        <p class="subheader">ESD Fun Friday Trivia</p>
        <p class="week-label" id="weekLabel"><span id="currentDate">Loading...</span></p>
        
        <div class="question-section">
            <div class="question-label">This Week's Question</div>
            <div class="question" id="mainQuestion">What is the capital of France?</div>
        </div>

        <form id="triviaForm">
            <div class="form-group">
                <label for="username">Your Name</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label>Your Answer</label>
                <div class="radio-group" id="answerOptions">
                    <div class="radio-option">
                        <input type="radio" id="option1" name="answer" value="Paris" required>
                        <label for="option1">Paris</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="option2" name="answer" value="London" required>
                        <label for="option2">London</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="option3" name="answer" value="Berlin" required>
                        <label for="option3">Berlin</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="option4" name="answer" value="Madrid" required>
                        <label for="option4">Madrid</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="bonus">Bonus Question</label>
                <div class="question-section" style="margin-bottom: 15px;">
                    <div class="question" id="bonusQuestion" style="font-size: 1.1em;">What year was the Eiffel Tower completed?</div>
                </div>
                <input type="text" id="bonus" name="bonus" placeholder="Enter your answer">
            </div>

            <button type="submit">Submit Answer</button>
        </form>

        <div class="success-message" id="successMessage">
            Thank you! Your answer has been submitted.
        </div>
        
        <div class="error-message" id="errorMessage">
            Sorry, there was an error submitting your answer. Please try again.
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw2CipndoJDGplMeRXGEPZVIJ-TQuGhGoTuYYOj691gORR7vsw1tzckTkWBIZqbPAwH/exec';
        const SHEET_ID = '1HUN_xbnrg77HzILm4ulZCKa1-yfHvw0vZQ6wUIMhsCA';
        
        let questionData = {
            question: "Loading...",
            options: ["", "", "", ""],
            bonus: "Loading..."
        };

        async function loadQuestionFromSheet() {
            try {
                const url = WEB_APP_URL + '?action=getQuestion';
                const response = await fetch(url);
                const text = await response.text();
                const data = JSON.parse(text);
                
                questionData = {
                    question: data.question,
                    options: [data.option1, data.option2, data.option3, data.option4],
                    bonus: data.bonus,
                    week: data.week,
                    category: data.category
                };
                
                displayQuestion();
                document.getElementById('currentDate').textContent = questionData.week;
            } catch (error) {
                console.error('Error loading question:', error);
                questionData = {
                    question: "Error loading question. Please refresh the page.",
                    options: ["", "", "", ""],
                    bonus: ""
                };
                displayQuestion();
            }
        }

        function displayQuestion() {
            document.getElementById('mainQuestion').textContent = questionData.question;
            document.getElementById('bonusQuestion').textContent = questionData.bonus;
            
            const container = document.getElementById('answerOptions');
            container.innerHTML = '';
            
            questionData.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'radio-option';
                div.innerHTML = `
                    <input type="radio" id="option${idx+1}" name="answer" value="${opt}" required>
                    <label for="option${idx+1}">${opt}</label>
                `;
                container.appendChild(div);
            });
        }

        setCurrentDate();
        loadQuestionFromSheet();
        
        function setCurrentDate() {
            document.getElementById('currentDate').textContent = 'Loading...';
        }
    </script>
</body>
</html>
